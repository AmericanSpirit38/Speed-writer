[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedwriter"
version = "0.1.0"
description = "Terminal typing speed game built with Rich"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "rich>=13.0.0",
  "faker>=20.0.0",
]

[project.scripts]
speedwriter = "speedwriter.__main__:main"

